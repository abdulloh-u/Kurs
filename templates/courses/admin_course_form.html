{% extends 'base.html' %}
{% block title %}Kursni {{ action }} - IT Shaharcha{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<div class="row justify-content-center my-4">
    <div class="col-lg-8">
        <div class="p-4 p-md-5 rounded-4 border bg-dark shadow-lg" style="border-color: #30363d !important;">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h3 class="fw-bold text-white mb-1">Kursni {{ action }}</h3>
                    <p class="text-light opacity-75 small mb-0">Kurs nomini, narxini va boshqa ma'lumotlarini kiriting</p>
                </div>
                <a href="{% url 'admin_course_list' %}" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-arrow-left"></i> Orqaga
                </a>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-white fw-semibold small">Kurs nomi <span class="text-danger">*</span></label>
                    <input type="text" name="title" value="{{ course.title }}" required class="form-control bg-dark text-white border-secondary py-2.5 shadow-none" placeholder="Masalan: Python Dasturlash">
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-white fw-semibold small">Narxi (so'mda) <span class="text-danger">*</span></label>
                        <input type="number" name="price" value="{{ course.price|floatformat:0 }}" required class="form-control bg-dark text-white border-secondary py-2.5 shadow-none" placeholder="Masalan: 500000">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-white fw-semibold small">Davomiyligi (oy/soat) <span class="text-danger">*</span></label>
                        <input type="text" name="duration" value="{{ course.duration }}" required class="form-control bg-dark text-white border-secondary py-2.5 shadow-none" placeholder="Masalan: 5 oy">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-white fw-semibold small">Kurs tavsifi <span class="text-danger">*</span></label>
                    <textarea name="description" rows="5" required class="form-control bg-dark text-white border-secondary shadow-none" placeholder="Kurs haqida batafsil ma'lumot...">{{ course.description }}</textarea>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-warning py-3 fw-bold text-dark rounded-3 shadow">
                        <i class="bi bi-check-lg me-1"></i> Saqlash
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
