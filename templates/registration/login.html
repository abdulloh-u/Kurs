{% extends 'base.html' %}
{% block title %}Tizimga kirish - IT Shaharcha{% endblock %}

{% block content %}
<style>
    .auth-card {
        background: #161b22 !important;
        border: 1px solid #30363d !important;
        border-radius: 16px;
    }
    .form-control {
        background-color: #0d1117 !important;
        border: 1px solid #30363d !important;
        color: #e6edf3 !important;
        border-radius: 10px;
        padding: 11px 15px;
        font-size: 14px;
    }
    .form-control:focus {
        border-color: #58a6ff !important;
        box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15) !important;
        color: #fff !important;
    }
    .form-label {
        font-size: 13px;
        font-weight: 600;
        color: #8b949e;
        margin-bottom: 6px;
    }
</style>

<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="p-4 auth-card shadow-lg">
            <div class="text-center mb-4">
                <span class="bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 px-3 py-2 rounded-3 fs-4 d-inline-block mb-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </span>
                <h3 class="fw-bold text-white fs-4">Tizimga kirish</h3>
                <p class="text-secondary small">IT Shaharcha platformasiga xush kelibsiz</p>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger bg-dark text-danger border border-danger border-opacity-25 small rounded-3 py-2">
                    Login yoki parol noto'g'ri. Iltimos, qaytadan urinib ko'ring.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Foydalanuvchi nomi</label>
                    <input type="text" name="username" class="form-control" placeholder="Username kiriting" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label">Parol</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-warning w-100 py-2.5 fw-bold text-dark fs-6 shadow-sm">
                    Kirish
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
